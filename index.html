<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart" />
    <title>product-preview-card-component-main</title>
</head>

<body>
    <main>
        <div class="product-card">
            <picture>
                <source media="(max-width: 600px)" srcset="images/image-product-mobile.jpg">

                <source media="(min-width: 601px)" srcset="images/image-product-desktop.jpg">

                <img src="images/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum">
            </picture>

            <div class="sidebar-right">
                <p class="perfume">PERFUME</p>
                <h1>Gabrielle Essence Eau De Parfum</h1>
                <p class="paragraph">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the
                    House of CHANEL.</p>
                <div class="price-container">
                    <p class="current-price">$149.99</p>
                    <!-- <p class="price">$149.99</p> -->
                    <p class="old-price">$169.99</p>
                </div>

                <a href="#">
                    <span class="material-symbols-outlined" style="font-size: 18px;">shopping_cart</span>
                    Add to Cart
                </a>
            </div>
        </div>
    </main>
</body>

</html>
